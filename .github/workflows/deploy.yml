name: Desplegar en el droplet

# Construye la imagen en GitHub Actions, la publica en GHCR y el droplet solo
# hace `pull`. El servidor tiene 1 vCPU y 458 MB de RAM: un build de Next.js
# ahi se queda sin memoria, por eso el build vive aca.
#
# Secretos que necesita (Settings › Secrets and variables › Actions):
#   DROPLET_HOST      IP o dominio del droplet
#   DROPLET_SSH_KEY   llave privada del usuario `deploy` (ed25519, sin passphrase)
#   DROPLET_HOST_KEY  llave publica de host del droplet, para no confiar a ciegas
#
# Los secretos de la aplicacion (base de datos, JWT, Fintoc, Resend) NO estan
# aca: viven solo en /opt/somos/.env dentro del servidor.
#
# Excepcion: los de Mercado Pago. Si estan cargados, cada despliegue los
# escribe en /opt/somos/.env (ver deploy/remote-deploy.sh). Si no estan, el
# servidor conserva lo que tenga: un secreto que falta no borra nada.
#   MERCADOPAGO_ACCESS_TOKEN    (secreto)   token de PRODUCCION, APP_USR-...
#   MERCADOPAGO_WEBHOOK_SECRET  (secreto)   clave secreta del webhook productivo
#   PASARELA                    (variable o secreto)  mercadopago | flow | fintoc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Dos despliegues a la vez dejarian el servidor a medio camino. Se encolan y no
# se cancela uno ya empezado.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      # Va primero, antes del checkout y del build: construir la imagen toma
      # varios minutos y sin esto el unico sintoma de un secreto vacio es un
      # "Could not resolve hostname" con el nombre en blanco, al final de todo.
      - name: Revisar que esten los secretos
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
        run: |
          faltan=()
          [ -n "$DROPLET_HOST" ]     || faltan+=(DROPLET_HOST)
          [ -n "$DROPLET_SSH_KEY" ]  || faltan+=(DROPLET_SSH_KEY)
          [ -n "$DROPLET_HOST_KEY" ] || faltan+=(DROPLET_HOST_KEY)

          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Faltan estos secretos: ${faltan[*]}"
            echo "Cargalos en Settings > Secrets and variables > Actions."
            echo "Tienen que estar en la pestana 'Secrets', NO en 'Variables':"
            echo "una variable no se lee con secrets.* y llega vacia."
            exit 1
          fi
          echo "Los tres secretos estan cargados."

      - uses: actions/checkout@v4

      # GHCR solo acepta nombres en minuscula y el usuario tiene mayusculas.
      - name: Resolver el nombre de la imagen
        id: imagen
        run: |
          nombre="${GITHUB_REPOSITORY,,}"
          echo "repo=${REGISTRO}/${nombre}" >> "$GITHUB_OUTPUT"
          echo "tag=${REGISTRO}/${nombre}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.imagen.outputs.tag }}
            ${{ steps.imagen.outputs.repo }}:latest
          # El cache hace que un cambio de codigo no reinstale node_modules.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preparar el acceso SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Llave de host fijada: si el servidor no es el que esperamos, el
          # despliegue falla en vez de entregarle la aplicacion a otro.
          printf '%s\n' "${{ secrets.DROPLET_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copiar la composicion al servidor
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/docker-compose.prod.yml \
            "deploy@${{ secrets.DROPLET_HOST }}:/opt/somos/docker-compose.yml"

      # Los secretos de la aplicacion viven en GitHub y bajan al .env del
      # servidor en cada despliegue. Solo se escriben los que tienen valor: uno
      # que no exista en GitHub se ignora y queda lo que ya hubiera en el
      # servidor, para que agregar un secreto no apague los demas.
      #
      # DATABASE_URL y JWT_SECRET quedan fuera: los genera el bootstrap, son
      # propios de cada servidor y no tienen por que viajar por CI.
      - name: Sincronizar secretos de la aplicacion
        env:
          PASARELA: ${{ secrets.PASARELA }}
          FLOW_API_KEY: ${{ secrets.FLOW_API_KEY }}
          FLOW_SECRET_KEY: ${{ secrets.FLOW_SECRET_KEY }}
          FLOW_AMBIENTE: ${{ secrets.FLOW_AMBIENTE }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_PUBLIC_KEY: ${{ secrets.MERCADOPAGO_PUBLIC_KEY }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          FINTOC_SECRET_KEY: ${{ secrets.FINTOC_SECRET_KEY }}
          FINTOC_PUBLIC_KEY: ${{ secrets.FINTOC_PUBLIC_KEY }}
          FINTOC_WEBHOOK_SECRET: ${{ secrets.FINTOC_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AVISO_DESARROLLO: ${{ secrets.AVISO_DESARROLLO }}
        run: |
          claves="PASARELA FLOW_API_KEY FLOW_SECRET_KEY FLOW_AMBIENTE
          MERCADOPAGO_ACCESS_TOKEN MERCADOPAGO_PUBLIC_KEY MERCADOPAGO_WEBHOOK_SECRET
          FINTOC_SECRET_KEY FINTOC_PUBLIC_KEY FINTOC_WEBHOOK_SECRET
          RESEND_API_KEY EMAIL_ENABLED EMAIL_FROM AVISO_DESARROLLO"

          pares="$(mktemp)"
          chmod 600 "$pares"
          for clave in $claves; do
            printf "%s=%s\n" "$clave" "${!clave}" >> "$pares"
          done

          {
            printf "export PARES_B64=%s\n" "$(base64 -w0 < "$pares")"
            cat deploy/sincronizar-env.sh
          } | ssh -i ~/.ssh/id_ed25519 "deploy@${{ secrets.DROPLET_HOST }}" 'bash -s'

          rm -f "$pares"

      # El script remoto y sus secretos viajan por stdin. Nada de esto va como
      # argumento: los argumentos quedan a la vista en el `ps` del servidor.
      - name: Desplegar
        env:
          IMAGEN: ${{ steps.imagen.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          PASARELA_ELEGIDA: ${{ vars.PASARELA || secrets.PASARELA }}
        run: |
          {
            printf 'export SOMOS_IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q\n' \
              "$IMAGEN" "$GHCR_USER" "$GHCR_TOKEN"
            printf 'export MP_ACCESS_TOKEN=%q MP_WEBHOOK_SECRET=%q PASARELA_ELEGIDA=%q\n' \
              "$MP_ACCESS_TOKEN" "$MP_WEBHOOK_SECRET" "$PASARELA_ELEGIDA"
            cat deploy/remote-deploy.sh
          } | ssh -i ~/.ssh/id_ed25519 "deploy@${{ secrets.DROPLET_HOST }}" 'bash -s'
